name: Scheduled conference update

# The conference updater. Every Monday at 09:00 UTC (or by hand), Claude Code
# researches conference dates and deadlines, then opens or updates one
# "Conference update" pull request for human review. Nothing merges on its own.
#
# Claude does only the research. When it finishes, a Claude Code Stop hook
# runs scripts/publish-update.sh automatically: it runs the checks (failures go
# back to Claude to fix), commits, pushes, and opens the pull request. The hook
# runs inside the Claude step, so it uses Claude's GitHub login and the pull
# request and commits are credited to claude[bot].
#
# Claude's login does all the writing. The workflow's own token is read-only,
# and checkout does not keep it in git: git would otherwise push with it, and
# GitHub holds checks on pushes from github-actions[bot] for approval.
#
# Runs on GitHub-hosted runners: this repo is public, and the self-hosted yeti
# runner serves private repos only.
#
# Every run uses the durable conference-update branch. An open review PR means
# that branch contains pending work. Without an open PR, identical data at the
# branch tip means the branch is stale and should be reset to current main.
#
# All research and editing rules live in automation/update-conferences.md.
# The prompt below adds only what this workflow needs from Claude: where to
# write the review summary, and to leave committing and the PR to the hook.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  id-token: write
  actions: read

concurrency:
  group: conference-update
  cancel-in-progress: false

jobs:
  update-conferences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Establish shared conference-update branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "claude[bot]"
          git config user.email "209825114+claude[bot]@users.noreply.github.com"
          git fetch origin main

          PR_NUMBER=$(gh pr list \
            --state open \
            --head conference-update \
            --base main \
            --json number \
            --jq '.[0].number // empty')

          if git ls-remote --exit-code --heads origin conference-update >/dev/null 2>&1; then
            git fetch origin conference-update
            git checkout -B conference-update origin/conference-update

            # Bring the branch up to date so this run uses main's current CLI,
            # validators, and instructions, and so the comparison below sees
            # only changes that are truly pending. A conflict needs a human.
            if ! git merge --no-edit origin/main; then
              echo "::error::conference-update conflicts with main; resolve it by hand"
              exit 1
            fi

            if [ -n "$PR_NUMBER" ]; then
              echo "Continuing conference-update for open PR #$PR_NUMBER"
            elif git diff --quiet origin/main HEAD -- data/conferences.json automation/research-state/; then
              # Nothing pending once main is merged in. This commonly happens
              # after a squash merge. Reset instead of replaying it; the hook
              # pushes the reset branch if this run has anything to publish.
              git checkout -B conference-update origin/main
              echo "Reset stale conference-update branch to current main"
            else
              echo "Preserving genuine pending conference data; no open PR exists yet"
            fi
          else
            git checkout -B conference-update origin/main
            echo "Starting new conference-update branch from current main"
          fi

          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Claude Code to update the data and open the review PR
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Run the recurring conference refresh. Follow
            automation/update-conferences.md completely.

            The workflow has already established the correct shared
            conference-update branch. Treat the current working copy of
            data/conferences.json as authoritative current state and preserve
            any genuine pending changes already present.

            Run the research-state CLI first and work only on the items it
            returns. Follow the phase-specific research procedure in the
            canonical instructions. Use the CLI to persist phase transitions,
            discovered deadline_pages, and check dates.

            During this refresh, modify only data/conferences.json and
            automation/research-state/YYYY.json. Run the repository tools and
            validators as-is; never edit or disable them.

            Do all research synchronously in this run.

            Write the review summary to /tmp/conference-pr-body.md using the
            canonical review-summary sections.

            Do not commit, push, or create or merge a pull request. When you
            finish, a hook runs the checks and publishes the update. If a check
            fails, the hook tells you what failed: fix the data and finish
            again.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_UVA }}
          claude_args: '--allowedTools "Bash(*),Read(*),Write(*),Edit(*),Glob(*),Grep(*),WebSearch,WebFetch,Edit(//tmp/conference-pr-body.md)"'
          show_full_output: true
          settings: |
            {
              "hooks": {
                "Stop": [{
                  "hooks": [{
                    "type": "command",
                    "command": "bash \"$CLAUDE_PROJECT_DIR\"/scripts/publish-update.sh",
                    "timeout": 300
                  }]
                }]
              }
            }

      - name: Confirm the update was published
        run: |
          if [ ! -f /tmp/conference-publish.done ]; then
            echo "::error::scripts/publish-update.sh did not finish, so no review PR was opened or updated"
            exit 1
          fi
