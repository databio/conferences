name: Deploy to Cloudflare Workers

# Redeploys the Worker whenever data or code changes on main — this is the
# "sync": a merge bundles the current data/conferences.json into the Worker at
# the edge. Follows the databio Cloudflare-deploy pattern (see pabc/lab-portal).
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
