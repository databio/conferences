name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check canonical conference JSON
        run: |
          node scripts/normalize.mjs data/conferences.json
          git diff --exit-code -- data/conferences.json
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test
